org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.268
# The lowest NeoForge players need (Cinematic Interactions itself needs 21.1.200)
neo_version_range=[21.1.200,)
loader_version_range=[1,)

## Mod Properties
mod_id=cinematicchests
mod_name=Cinematic Chests
mod_license=MIT
mod_version=0.1.1
mod_group_id=com.cinematicchests

## Cinematic Interactions (host mod). The jar lives in libs/ because the mod is only on CurseForge.
## 0.18.30 is the version this add-on is compiled and tested against.
cinematic_jar=libs/cinematic-interactions-neoforge-1.21.1-0.18.30.jar
# Capped to 0.18.x: this add-on patches Cinematic Interactions internals, which can change between releases. Widen after testing.
cinematic_version_range=[0.18.30,0.19)

## Sophisticated (optional): compiled against Core; Storage and Backpacks are dev-run test mods only
sophisticated_core_version=1.21.1-1.5.43.2504
sophisticated_storage_version=1.21.1-1.6.22.2244
sophisticated_backpacks_version=1.21.1-3.26.23.2263
# Lowest Sophisticated Core the upgrade support was built for. No upper bound: a newer version that changed what this calls
# only switches the upgrade support off (GuardedRack), so players are never locked out of launching.
sophisticated_core_range=[1.5.39,)
